version: 3
workdir: .
allow:
  depOnAnyVendor: false
exclude:
  - testdata
vendors:
  tools:
    in: golang.org/x/tools/**
  testify:
    in: github.com/stretchr/testify/**
components:
  bidirekt:
    in: .
  cmd:
    in: cmd/**
  command:
    in: internal/command
  reader:
    in: internal/reader
  model:
    in: internal/model
  writer:
    in: internal/writer
  tests:
    in: tests/**
deps:
  cmd:
    mayDependOn:
      - command
  command:
    mayDependOn:
      - reader
      - model
      - writer
  reader:
    mayDependOn:
      - model
    canUse:
      - tools
  writer:
    mayDependOn:
      - model
  tests:
    anyProjectDeps: true
    canUse:
      - testify
